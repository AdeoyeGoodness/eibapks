# eibapks — static site + APK downloads + upload API
#
# Install:
#   sudo cp deploy/nginx-eibapks.conf /etc/nginx/sites-available/eibapks
#   sudo ln -s /etc/nginx/sites-available/eibapks /etc/nginx/sites-enabled/eibapks
#   sudo nginx -t && sudo systemctl reload nginx
#
# Layout on the host:
#   /var/www/eibapks/site   <- this repo (index.html, cgas/, lock/, vanguard/, admin/)
#   /var/www/eibapks/apks   <- APK_DIR (served at /apks/, written by the upload server)
#
# The Node upload server (server/server.js) runs on 127.0.0.1:8090 and only
# handles /api/*. Everything else is static.

upstream eibapks_api {
    server 127.0.0.1:8090;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name apps.example.com;   # <-- change to your domain

    root /var/www/eibapks/site;
    index index.html;

    # Uploads can be large — allow up to 300 MB (match MAX_UPLOAD_BYTES).
    client_max_body_size 300m;

    # --- Upload / management API -> Node ---------------------------------
    location /api/ {
        proxy_pass http://eibapks_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream the upload body straight through, no buffering to disk.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # --- APK downloads ----------------------------------------------------
    location /apks/ {
        alias /var/www/eibapks/apks/;
        types { application/vnd.android.package-archive apk; }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache";   # always hand out the current file
        # never expose backups over http
        location ~ ^/apks/backups/ { return 404; }
    }

    # --- Static site ------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    # Keep the admin page from being indexed even if linked.
    location = /admin/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ =404;
    }
}

# --- HTTPS -------------------------------------------------------------------
# After DNS points at this box, run:  sudo certbot --nginx -d apps.example.com
# certbot will rewrite the server{} above to listen on 443 with your cert.
